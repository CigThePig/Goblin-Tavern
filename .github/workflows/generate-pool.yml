name: Generate Snippet Pool

# Phase 125 / ISSUE-094 — Living Cast arc, Phase E.
#
# Build-time generation pipeline. Given a spec under specs/cards/,
# calls Claude, runs the Phase D gates, retries on failure, dedupes
# near-duplicates, and opens a PR with the regenerated pool files
# under src/cards/compose/pools/<templateId>/. Trigger is manual
# (workflow_dispatch) so model spend stays deliberate.
#
# Prerequisite: ANTHROPIC_API_KEY must be set as a repo secret.

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Path to the spec YAML (relative to repo root)'
        required: true
        default: 'specs/cards/drink_order.spec.yaml'
      model:
        description: 'Claude model id (defaults to claude-sonnet-4-6)'
        required: false
        default: 'claude-sonnet-4-6'
      max-retries:
        description: 'Per-slot retry budget'
        required: false
        default: '3'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-pool-${{ github.event.inputs.spec }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm run generate-pool -- \
            --spec "${{ github.event.inputs.spec }}" \
            --model "${{ github.event.inputs.model }}" \
            --max-retries "${{ github.event.inputs.max-retries }}"
      - name: Open PR
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: |
            Regenerate snippet pools from ${{ github.event.inputs.spec }}

            Generated by .github/workflows/generate-pool.yml on run
            ${{ github.run_id }}. Model: ${{ github.event.inputs.model }}.
            Spec input: ${{ github.event.inputs.spec }}.
          branch: generate-pool/${{ github.run_id }}
          title: 'Generate pools from ${{ github.event.inputs.spec }}'
          body: |
            Automated pool regeneration from
            `${{ github.event.inputs.spec }}` via Phase E pipeline.

            Model: `${{ github.event.inputs.model }}`
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The pipeline cleared all six structural gates before this PR
            was opened. Review the diff against the prior committed
            pools and merge if the prose lands.
          delete-branch: true
