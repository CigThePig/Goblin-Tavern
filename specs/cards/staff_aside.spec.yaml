# Phase 126 / ISSUE-095 — Living Cast arc, Phase F (first situation).
#
# Generation spec for the staff_aside template — the first Phase F
# scale-out beyond the Phase B / C drink_order spike. The committed
# snippet pool at `src/cards/compose/pools/staffAside/` was authored by
# hand following this spec; this file is the design record the in-repo
# Claude Code authoring loop reads.
#
# (Phase 130 / ISSUE-099, Voiced Surface arc Phase 4, retired the
# build-time `npm run generate-pool` pipeline. Pool authoring is now an
# in-repo plan-mode run gated by `runAllGates` — see
# `docs/plans/voiced-surface-arc.md` Appendix A.)

templateId: staff_aside
voiceRegister: staff_quarters
status: phase_7_voiced_surface_arc_complete
purpose: >
  Generate short in-character pre-shift remarks from a staff member to the
  owner. The body STATES what's going on with the staff member (Phase 7
  added sim-backed establishing_line) and voices their reaction
  (flavor-only aside_line). Voice variation is driven by the shipped
  Phase-A CastAttributes.voice scalars carried by staff
  (createStaffCastAttributes). No invented events, named NPCs, factions,
  or past incidents.

# Phase 133 / ISSUE-102 — Voiced Surface arc, Phase 7. Sim signals the
# establishing_line pool reaches for. The same staff signals the
# staff_burnout template uses; this template adds a `loyalty_risk`
# memory present and an `identity` memory present that fit the
# staff_identity / relationship_test framing specifically.
simSignalsInUse:
  - { signal: staff.stress, bands: [low, mid, high] }
  - { signal: staff.fatigue, bands: [low, mid, high] }
  - { kind: pressureRising, pressureIds: [staff_loyalty_risk, staff_burnout] }
  - { kind: memoryPresent, tags: [identity, warning, staff] }
  - { kind: repeatCount, subjectTag: staff }
  - { kind: hasNamedEntity, role: primaryActor, entityKind: staff }

slots:
  - id: establishing_line
    required: true
    claims: sim-backed
    maxWords: 14
    description: >
      Third-person narration of what's actually going on with this
      staff member. Names the sim truth — stress band, fatigue band,
      rising loyalty-risk or burnout pressure, prior identity-warning
      memory, repeat staff seed appearance — pinned by a state-lookup
      condition. The unconditional fallback claims only what the seed
      firing guarantees (a staff member surfacing themselves before
      the day opens). Added in Phase 7; replaces the dangling
      textIngredients sensoryDetails fragment that buildStaffAsideBody
      previously appended as "grounding."

  - id: aside_line
    required: true
    claims: flavor
    maxWords: 12
    description: >
      The staff member's voiced remark before service opens. May show
      mood, fatigue, professionalism, or attitude; must not claim a
      specific past event or named entity.

  - id: manner_note
    required: false
    claims: flavor
    maxWords: 10
    description: >
      An optional physical beat — posture, hands, breath, expression.
      Omitted rather than weak.

  # Phase 132 / ISSUE-101 — Voiced Surface arc, Phase 6.
  # Choice & consequence voice. The helper `composeChoicesFromSeed` in
  # `src/cards/cardHelpers.ts` synthesises one SlotSpec per response slot
  # for `choice_label` and one per `EffectPreview` for `effect_preview`,
  # threading the iteration as ConditionContext into `pickSnippet`. Both
  # slots are optional — unmatched seeds fall back to the sim's verbatim
  # `slot.labelHint` / `effect.readable`. Mechanical fields (verb /
  # targetId / shape and per-effect kind / target / amount / tags) are
  # unchanged by composition; only wording moves.

  - id: choice_label
    required: false
    claims: flavor
    maxWords: 6
    status: SIGNAL_AVAILABLE
    description: >
      Voiced rendering of a response slot's `labelHint`. Keyed on
      (responseVerb, responseShape, voiceAxis, signalEquals). Pool
      authored in `src/cards/compose/pools/staffAside/choiceLabel.ts`.

  - id: effect_preview
    required: false
    claims: flavor
    maxWords: 10
    status: SIGNAL_AVAILABLE
    description: >
      Voiced rendering of one `ConsequenceProfile.immediateEffects[i]`.
      Each composed line corresponds 1-to-1 to a real EffectPreview by
      construction — the snippet replaces only the readable string,
      never the kind / target / amount / tags. Pool authored in
      `src/cards/compose/pools/staffAside/effectPreview.ts`.

voiceAxesInPlay:
  terseness:
    0: full clause
    1: compact
    2: clipped imperative
  warmth:
    0: prickly/distant
    1: neutral
    2: familiar/inviting
  formality:
    0: casual/blunt
    1: plain
    2: titled/professional
  floridity:
    0: literal
    1: one image allowed
    2: vivid but short, no lore

verbalTicsCovered:
  - trails_off
  - interrupts_self
  - understates
  - repeats_for_emphasis
  - qualifies_everything
  - italicises_stakes
  - quotes_someone_else

# Targets the line may reach for. Pre-shift is a posture/work moment, not
# a customer-facing transaction — there is no drink or menu item to ask
# for. Listing the conceptual "subject of the remark" keeps the model
# anchored.
allowedTargets:
  - the day ahead
  - the morning
  - the work
  - the kitchen
  - the floor
  - the owner directly
  - silence held

mustNotInvent:
  - named NPCs
  - named factions
  - specific injuries
  - specific battles
  - debt history
  - previous tavern incidents
  - who slighted whom
  - claims about supply unless the seed/state says so

hardBounds:
  perSlotWords:
    aside_line: 12
    manner_note: 10
  punctuation: normal prose punctuation only
  noFragmentsThatRequireConcatenation: true
  noMadLibPlaceholders: true
  noModernSlang: true
  noEarthIdioms: true
  noDirectMechanicalLanguage: true

gradientPolicy:
  base: one unconditional fallback (always fires)
  middle: single-axis snippets (voiceAxis atLeast/atMost) — the COMMON rung
  top: two-axis snippets — the RARE rung, sharpens when both extremes land
  tic: single verbalTic snippets — independent of the axis rungs

positiveExemplars:
  - id: terse_prickly_plain
    claims: flavor
    voice: { terseness: 2, warmth: 0 }
    slotLines:
      aside_line: "What's wrong. Say it and I'll handle it."
      manner_note: "They roll their sleeves before answering."
    why_it_works: "Sharp, owner-facing, no checkable claim."

  - id: warm_informal_plain
    claims: flavor
    voice: { warmth: 2, formality: 0 }
    slotLines:
      aside_line: "Look — I'm not going anywhere. We sort it."
      manner_note: "They start the kettle without being asked."
    why_it_works: "Familiar without backstory. Mood, not history."

  - id: formal_restrained
    claims: flavor
    voice: { formality: 2, floridity: 0 }
    slotLines:
      aside_line: "I shall remain steady, if conduct serves."
      manner_note: "They stand a little straighter than the room asks."
    why_it_works: "Professional voice from phrasing alone."

  - id: florid_open_voice
    claims: flavor
    voice: { floridity: 2, terseness: 0 }
    slotLines:
      aside_line: "I've been carrying a heavy hush since dawn."
    why_it_works: "One vivid image, claims nothing specific."

  - id: clipped_warm
    claims: flavor
    voice: { terseness: 2, warmth: 2 }
    slotLines:
      aside_line: "Quick word. I'm in your corner today."
    why_it_works: "Brisk + supportive. No event claimed."

  - id: just_terse
    claims: flavor
    voice: { terseness: 2 }
    slotLines:
      aside_line: "Ready. Tell me what's needed."
    why_it_works: "Single-axis middle-rung anchor."

  - id: just_warm
    claims: flavor
    voice: { warmth: 2 }
    slotLines:
      aside_line: "You look tired. We'll see the morning through together."
    why_it_works: "Solidarity reads warm without inventing detail."

  - id: just_formal
    claims: flavor
    voice: { formality: 2 }
    slotLines:
      aside_line: "At your service, as the house requires."
    why_it_works: "Hedged courtesy carries formality with no lore."

  - id: just_florid
    claims: flavor
    voice: { floridity: 2 }
    slotLines:
      aside_line: "Sleep tasted like ash. Still — the kettle's hot."
    why_it_works: "One image plus a return to work."

  - id: just_plain_cold
    claims: flavor
    voice: { warmth: 0 }
    slotLines:
      aside_line: "If there's a problem, say it plainly."
    why_it_works: "Low warmth alone reads as curt without needing terseness."

  - id: tic_qualifies
    claims: flavor
    voice: { verbalTic: qualifies_everything }
    slotLines:
      aside_line: "It's fine, I think. Mostly. Probably."
      manner_note: "They wipe the same spot twice."
    why_it_works: "Hedging is the whole tic; no fact claimed."

  - id: tic_interrupts
    claims: flavor
    voice: { verbalTic: interrupts_self }
    slotLines:
      aside_line: "I'm — well, I'm here. That should count for something."
    why_it_works: "Self-reversal IS the tic; stays compact."

  - id: tic_understates
    claims: flavor
    voice: { verbalTic: understates }
    slotLines:
      aside_line: "A bit of strain, perhaps. Nothing the work won't sort."
    why_it_works: "'A bit of strain' downgrades stakes; no specific incident."

  - id: tic_repeats
    claims: flavor
    voice: { verbalTic: repeats_for_emphasis }
    slotLines:
      aside_line: "I'll work. I'll work, and I'll work properly."
    why_it_works: "Tripled word lands the tic; stakes implied via repetition."

  - id: tic_trails_off
    claims: flavor
    voice: { verbalTic: trails_off }
    slotLines:
      aside_line: "I just wanted to say — well, you know…"
    why_it_works: "Mid-clause fade is the whole tic; still parses as a thought."

  - id: tic_italicises
    claims: flavor
    voice: { verbalTic: italicises_stakes }
    slotLines:
      aside_line: "I am still here. That part should count."
    why_it_works: "One weighted beat lands the stress tic."

  - id: tic_quotes_someone
    claims: flavor
    voice: { verbalTic: quotes_someone_else }
    slotLines:
      aside_line: "As my old master said — show up first."
    why_it_works: >
      Borderline-safe: 'old master' is generic attribution, not a named
      NPC or checkable relation — mirrors drink_order's 'old captain'.

negativeExamples:
  - id: mad_lib_flatness
    line: "The staff member is here today."
    fails: [specificity-gradient, voice-bounds]
    reason: "Mechanically true but dead; invites placeholder prose."

  - id: unsupported_backstory
    line: "After yesterday's brawl, I almost didn't come back."
    fails: [sim-coherence]
    reason: "Invents incident history; needs memory/repeat condition."

  - id: lore_overreach
    line: "By the Sapphire Baron's writ, I shall serve faithfully today."
    fails: [sim-coherence, voice-bounds]
    reason: "Invents authority and setting object. Formality is not lore licence."

  - id: modern_slang
    line: "Lowkey not vibing with this morning, owner."
    fails: [voice-bounds]
    reason: "Register breaks tavern-fantasy voice."

  - id: overlong_florid
    line: "Allow me to lay before you a cathedral of pre-dawn exhaustion, owner."
    fails: [length, voice-bounds]
    reason: "Floridity is not permission to monologue."

  - id: conditional_without_condition
    line: "Brakka's lies put me in this mood."
    fails: [sim-coherence]
    reason: "Names a specific NPC + asserts blame relation; no condition backs that."

  - id: two_extreme_overreliance
    line: "(a pool whose only specific snippets each require two axis extremes)"
    fails: [specificity-gradient, diversity]
    reason: >
      Bad POOL SHAPE, not a single bad line. Same lesson as drink_order:
      two-extreme snippets fire rarely under [-1,0,0,1] perturbation, so
      the pool collapses onto the fallback in play. A single-axis middle
      rung is mandatory.

snippetPools:
  # Phase 133 / ISSUE-102 — Voiced Surface arc, Phase 7. Sim-backed
  # establishing line: states what the sim says about this staff member
  # before the voiced aside_line lands. Every non-fallback snippet
  # carries >=1 state-lookup condition; the unconditional fallback
  # claims only what the seed firing guarantees.
  - slotId: establishing_line
    required: true
    snippets:
      - id: est_fallback
        text: "A staff member surfaces before the day fully opens."
        conditions: []

      - id: est_high_stress
        text: "Their shoulders are pulled tight before the door's even propped."
        conditions:
          - { kind: signalEquals, role: primaryActor, signal: staff.stress, equals: high }
      - id: est_low_stress
        text: "They walk through quiet, the morning sitting easy on them."
        conditions:
          - { kind: signalEquals, role: primaryActor, signal: staff.stress, equals: low }
      - id: est_high_fatigue
        text: "They came in slow today; the long week is plain to see."
        conditions:
          - { kind: signalEquals, role: primaryActor, signal: staff.fatigue, equals: high }
      - id: est_loyalty_risk_rising
        text: "Something's been pulling them away from the work these days."
        conditions:
          - { kind: pressureRising, pressureId: staff_loyalty_risk }
      - id: est_burnout_rising
        text: "Tomorrow's load is already crowding into this morning."
        conditions:
          - { kind: pressureRising, pressureId: staff_burnout }
      - id: est_identity_memory
        text: "Last week's slight still sits in the room between you."
        conditions:
          - { kind: memoryPresent, tag: identity }
      - id: est_warning_memory
        text: "They've been on warning before; the rota remembers."
        conditions:
          - { kind: memoryPresent, tag: warning }
      - id: est_repeat_visit
        text: "Third quiet morning in a row from this one."
        conditions:
          - { kind: repeatCount, subjectTag: staff, atLeast: 3 }

      - id: est_stress_loyalty
        text: "Wound tight, and pulling back from the room besides."
        conditions:
          - { kind: signalEquals, role: primaryActor, signal: staff.stress, equals: high }
          - { kind: pressureRising, pressureId: staff_loyalty_risk }
      - id: est_fatigue_warning
        text: "Slow steps, and they were on warning last week already."
        conditions:
          - { kind: signalEquals, role: primaryActor, signal: staff.fatigue, equals: high }
          - { kind: memoryPresent, tag: warning }

  - slotId: aside_line
    required: true
    snippets:
      - id: aside_fallback_plain
        text: "Morning. I'm ready when you are."
        conditions: []

      - id: aside_terse
        text: "Ready. Tell me what's needed."
        conditions:
          - { kind: voiceAxis, role: primaryActor, axis: terseness, atLeast: 2 }
      - id: aside_warm
        text: "You look tired. We'll see the morning through together."
        conditions:
          - { kind: voiceAxis, role: primaryActor, axis: warmth, atLeast: 2 }
      - id: aside_cold
        text: "If there's a problem, say it plainly."
        conditions:
          - { kind: voiceAxis, role: primaryActor, axis: warmth, atMost: 0 }
      - id: aside_formal
        text: "At your service, as the house requires."
        conditions:
          - { kind: voiceAxis, role: primaryActor, axis: formality, atLeast: 2 }
      - id: aside_florid
        text: "Sleep tasted like ash. Still — the kettle's hot."
        conditions:
          - { kind: voiceAxis, role: primaryActor, axis: floridity, atLeast: 2 }

      - id: aside_terse_cold
        text: "What's wrong. Say it and I'll handle it."
        conditions:
          - { kind: voiceAxis, role: primaryActor, axis: terseness, atLeast: 2 }
          - { kind: voiceAxis, role: primaryActor, axis: warmth, atMost: 0 }
      - id: aside_terse_warm
        text: "Quick word. I'm in your corner today."
        conditions:
          - { kind: voiceAxis, role: primaryActor, axis: terseness, atLeast: 2 }
          - { kind: voiceAxis, role: primaryActor, axis: warmth, atLeast: 2 }
      - id: aside_warm_informal
        text: "Look — I'm not going anywhere. We sort it."
        conditions:
          - { kind: voiceAxis, role: primaryActor, axis: warmth, atLeast: 2 }
          - { kind: voiceAxis, role: primaryActor, axis: formality, atMost: 0 }
      - id: aside_formal_plain
        text: "I shall remain steady, if conduct serves."
        conditions:
          - { kind: voiceAxis, role: primaryActor, axis: formality, atLeast: 2 }
          - { kind: voiceAxis, role: primaryActor, axis: floridity, atMost: 0 }
      - id: aside_florid_open
        text: "I've been carrying a heavy hush since dawn."
        conditions:
          - { kind: voiceAxis, role: primaryActor, axis: floridity, atLeast: 2 }
          - { kind: voiceAxis, role: primaryActor, axis: terseness, atMost: 0 }

      - id: aside_tic_qualifies
        text: "It's fine, I think. Mostly. Probably."
        conditions:
          - { kind: verbalTic, role: primaryActor, tic: qualifies_everything }
      - id: aside_tic_interrupts
        text: "I'm — well, I'm here. That should count for something."
        conditions:
          - { kind: verbalTic, role: primaryActor, tic: interrupts_self }
      - id: aside_tic_understates
        text: "A bit of strain, perhaps. Nothing the work won't sort."
        conditions:
          - { kind: verbalTic, role: primaryActor, tic: understates }
      - id: aside_tic_repeats
        text: "I'll work. I'll work, and I'll work properly."
        conditions:
          - { kind: verbalTic, role: primaryActor, tic: repeats_for_emphasis }
      - id: aside_tic_trails_off
        text: "I just wanted to say — well, you know…"
        conditions:
          - { kind: verbalTic, role: primaryActor, tic: trails_off }
      - id: aside_tic_italicises
        text: "I am still here. That part should count."
        conditions:
          - { kind: verbalTic, role: primaryActor, tic: italicises_stakes }
      - id: aside_tic_quotes
        text: "As my old master said — show up first."
        conditions:
          - { kind: verbalTic, role: primaryActor, tic: quotes_someone_else }

  - slotId: manner_note
    required: false
    snippets:
      - id: manner_warm_kettle
        text: "They start the kettle without being asked."
        conditions:
          - { kind: voiceAxis, role: primaryActor, axis: warmth, atLeast: 2 }
      - id: manner_cold_sleeves
        text: "They roll their sleeves before answering."
        conditions:
          - { kind: voiceAxis, role: primaryActor, axis: warmth, atMost: 0 }
          - { kind: voiceAxis, role: primaryActor, axis: terseness, atLeast: 2 }
      - id: manner_formal_stand
        text: "They stand a little straighter than the room asks."
        conditions:
          - { kind: voiceAxis, role: primaryActor, axis: formality, atLeast: 2 }
      - id: manner_florid_smile
        text: "Their smile fits like a borrowed coat."
        conditions:
          - { kind: voiceAxis, role: primaryActor, axis: floridity, atLeast: 2 }
          - { kind: voiceAxis, role: primaryActor, axis: warmth, atMost: 0 }
      - id: manner_qualifies_wipe
        text: "They wipe the same spot twice."
        conditions:
          - { kind: verbalTic, role: primaryActor, tic: qualifies_everything }

diversityCases:
  - terseness>=2 alone -> brisk professional readiness
  - warmth>=2 alone -> solidarity / care for the owner
  - warmth<=0 alone -> curt willingness
  - formality>=2 alone -> ceremonious assurance
  - floridity>=2 alone -> one inward image
  - terseness>=2 AND warmth<=0 -> sharpened cold competence (top rung)
  - any verbalTic present -> one sentence-motion variant
  - no matching condition -> plain fallback (allowed plain, never dead)

mustPass:
  coverage:
    rule: required slot aside_line has at least one unconditional fallback
    current: aside_fallback_plain
  specificityGradient:
    rule: >
      pool contains (a) fallback, (b) single-axis middle-rung snippets, (c)
      two-axis top-rung snippets, and (d) tic snippets. The single-axis rung
      is mandatory.
    current: true
  voiceBounds:
    rule: >
      title <= 6 words (no trailing "…", no immediate duplicate token);
      establishing_line <= 14; aside_line <= 12; manner_note <= 10
    current: true
  simCoherence:
    rule: >
      establishing_line (added Phase 7) is claims: sim-backed — every
      non-fallback snippet carries >=1 state-lookup condition
      (signalEquals, pressureRising, repeatCount, memoryPresent,
      hasNamedEntity). aside_line, manner_note, title are claims:
      flavor — no checkable history, no named entities, no event-claim
      language unbacked by a condition.
    current: true
  determinism:
    rule: same seed + same state + same slot returns same snippet after tie-break
    current: proven by Phase C/D / F template tests
  diversity:
    rule: >
      sample pool yields >= 6 distinct aside_line outputs and >= 3
      distinct establishing_line outputs across reachable signal bands,
      sampled across a RANDOM staff cast sample drawn from the real
      [-1,0,0,1]-perturbed distribution.
    current: proven by Phase D harness extended in Phase F and Phase 7
  dedupe:
    rule: >
      no within-slot pair >= 0.85 canonical Levenshtein; no cross-slot
      canonical equality across the five live slots (title,
      establishing_line, aside_line, manner_note, choice_label,
      effect_preview).
    current: true

# ----------------------------------------------------------------------
# loopback — Phase 7 added the sim-backed establishing_line slot. The
# Voiced Surface arc anticipates that migrations may surface gaps in
# Movement I (a missing signal or axis). Recording the Phase 7 pass:
# ----------------------------------------------------------------------

loopback:
  surfaced:
    - none

  notes:
    - >
      The Phase 1 signal surface already exposes `staff.stress` and
      `staff.fatigue`; the `staff_loyalty_risk` and `staff_burnout`
      pressures are pre-existing on every staff_identity seed (see
      expandedSeedGenerators.ts:802-813). The memory tags `identity`
      and `warning` are written by the same generator (line 822-825).
      No additive signal-surface work was needed.
    - >
      The dangling textIngredients sensoryDetails fragment that
      buildStaffAsideBody previously appended as body grounding is
      now removed in favour of the composed establishing_line. The
      Phase 7 template tests assert the body's first line is the
      sim-backed snippet, not a raw sensory fragment.

# ── Phase 150 / ISSUE-118 — Legible Surface arc, Phase 5 ─────────────
#
# Staff & Personnel cluster content matrix. The establishing_line slot
# opts into `saliencePolicy: 'multi'` (the assembler tie-breaks top-
# specificity matches by salience and appends an orthogonal secondary
# fact when one resolves within the combined word budget). New combo
# cells deepen the 9-cell stress × fatigue matrix; new state-keyed
# spec-1 snippets are added to aside_line and manner_note so reaction
# and sensory beats vary with state, not just voiceProfile.
#
# Salience table at `src/cards/compose/salience.ts`:
#   staff_identity reads (order):
#     1. signal staff.stress (primaryActor) — extremity 2 at low/high
#     2. signal staff.fatigue (primaryActor) — extremity 2 at low/high
#     3. pressure staff_loyalty_risk
#     4. pressure staff_burnout
#     5. memory identity
#     6. memory warning
#     7. repeat subjectTag: staff, atLeast: 3
phase150:
  saliencePolicy: multi
  multiFactJoin: " — "

  newEstablishingMatrixCells:
    # Four corner combos of the stress × fatigue matrix. Mid×mid stays
    # unauthored (unconditional fallback handles it).
    - id: est_low_stress_low_fatigue
      conditions: [stress=low, fatigue=low]
    - id: est_low_stress_high_fatigue
      conditions: [stress=low, fatigue=high]
    - id: est_high_stress_low_fatigue
      conditions: [stress=high, fatigue=low]
    - id: est_high_stress_high_fatigue
      conditions: [stress=high, fatigue=high]
    # Pressure × signal / memory top rungs (orthogonal to band×band).
    - id: est_fatigue_burnout
      conditions: [fatigue=high, pressureRising staff_burnout]
    - id: est_stress_identity
      conditions: [stress=high, memoryPresent identity]
    - id: est_loyalty_risk_warning
      conditions: [pressureRising staff_loyalty_risk, memoryPresent warning]

  newAsideLineStateKeyed:
    - aside_state_high_stress      # signalEquals stress=high
    - aside_state_low_stress       # signalEquals stress=low
    - aside_state_high_fatigue     # signalEquals fatigue=high
    - aside_state_loyalty_risk     # pressureRising staff_loyalty_risk
    - aside_state_burnout          # pressureRising staff_burnout
    - aside_state_repeat           # repeatCount staff ≥ 3
    - aside_state_identity         # memoryPresent identity
    - aside_state_warning          # memoryPresent warning

  newMannerNoteStateKeyed:
    - manner_state_high_stress
    - manner_state_high_fatigue
    - manner_state_burnout
    - manner_state_warning
    - manner_state_repeat

# Phase 172 / ISSUE-140 — Complete Surface arc, Phase 5 (Staff &
# Personnel matrix fill). Added the est_low_fatigue single rung to the
# establishing_line pool. Before this, the pool authored est_high_fatigue
# but no est_low_fatigue, so the (stress=mid, fatigue=low) cell of the
# 9-cell stress x fatigue matrix had no covering snippet and fell to the
# bare fallback. With est_low_fatigue (and the pre-existing est_low_stress
# / est_high_stress rungs + the four corner combos), all eight meaningful
# cells now resolve to a covering line; the all-mid centre stays on the
# unconditional fallback by design. Proven cell-by-cell in
# tests/cards/compose/phase172.matrixCoverage.test.ts.
