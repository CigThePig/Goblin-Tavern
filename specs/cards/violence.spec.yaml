# Phase 138 / ISSUE-107 — Voiced Surface arc, Phase 12 (Crises & Safety).
#
# Generation spec for the violence compositional template. Pre-Phase-12
# violence seeds (`violence` / `customer_incident` / `during_service`)
# had no dedicated template and routed through `fallbackCard`. This
# spec is the first dedicated card for the family.
#
# The seed's primaryActor is a customer-group ref — picker-rotated
# across groups whose tags include `rowdy` / `dangerous` /
# `incident_prone` (`issueSeedGenerators.ts:2117-2144`). Customer
# groups carry Phase-128 cohort `castAttributes` (the four voice axes
# + optional verbal tic; no specialty/blindspot/affinity surface), so
# the group's voice can drive the reaction line.
#
# Voice register `tavern_floor` — the brawl is on the floor, the owner
# is reading the room out loud.

templateId: violence
voiceRegister: tavern_floor
status: phase_12_voiced_surface_arc_shipped
purpose: >
  Generate voiced cards for the during_service violence situation.
  The body states the actual sim situation (customer-group rowdiness
  band, customer-group satisfaction band, area damage band, violence
  pressure rising, prior owner choice surfaced from memory tags,
  repeat count, severity tier) and carries the rowdy group's voice in
  their first-person reply. The legacy seed routed to the fallback
  card; this is the first dedicated rendering.

appliesTo:
  seedFamilies: ['violence']
  seedTypes: ['customer_incident']
  timings: ['during_service']

slots:
  - id: title
    required: true
    claims: flavor
    maxWords: 6
    description: >
      Short situational title; template glue prepends the customer
      group's label as `${group.label}: ${snippet}`. Snippet text stays
      ≤ 4 words so a 2-word group label keeps the final composed title
      within the legacy 6-word total budget. Voice-bounds gate forbids
      trailing "…" and immediate token duplication.

  - id: establishing_line
    required: true
    claims: sim-backed
    maxWords: 14
    description: >
      Third-person narration of the violence situation. Names what
      happened — customer_group rowdiness band high (Phase-12 new
      band), customer_group satisfaction band low, area damage band,
      violence pressure rising, prior memory (warning, brawl, banned,
      hired security), repeat count, severity tier. Unconditional
      fallback claims only that tension on the floor has slipped its
      ordinary leash.

  - id: reaction_line
    required: true
    claims: flavor
    maxWords: 12
    description: >
      The group's first-person reply, voice-axis driven (terseness,
      warmth, formality, floridity) plus verbal tic. May show
      defiance, swagger, threat, cold contempt, ironic complaint.
      Must not assert specific past incidents or invent named NPCs.

  - id: manner_note
    required: false
    claims: flavor
    maxWords: 10
    description: >
      Optional third-person sensory beat — a shoulder dropped, a tankard
      slammed, the bench creaking. Voice-axis gated only; no checkable
      claim.

voiceAxesInPlay: [terseness, warmth, formality, floridity]
verbalTicsCovered: [understates, qualifies_everything, interrupts_self, italicises_stakes, repeats_for_emphasis, quotes_someone_else]

simSignalsInUse:
  - { kind: signalEquals, signals: [customer_group.rowdiness, customer_group.satisfaction, customer_group.loyalty], roles: [primaryActor], bands: [low, mid, high] }
  - { kind: signalEquals, signals: [area.damage], roles: [location], bands: [low, mid, high] }
  - { kind: pressureRising, pressureIds: [violence] }
  - { kind: memoryPresent, tags: [violence_warning_seen, security_hired_recently, brawl, warning, dangerous] }
  - { kind: repeatCount, subjectTag: violence }
  - { kind: hasTag, tags: [violence, rowdy, dangerous, urgent] }
  - { kind: severityAtLeast, value: 70 }
  - { kind: voiceAxis, role: primaryActor }
  - { kind: verbalTic, role: primaryActor }

mustNotInvent:
  - named individuals from the rowdy group beyond the seed
  - specific past fights or brawls beyond the seeded memory tags
  - specific damage / rowdiness numbers ("rowdiness 80")
  - earth idioms, modern slang, real-world brand or place language
  - the legacy `pickAreaStateAdjective` title prefix (`Damaged main room: main room`)

positiveExemplars:
  title:
    - "Ogres: tempers fraying"
    - "Adventurers: spoiling for trouble"
    - "Miners: blood up"
  establishing_line:
    - "The rowdiest table has slipped past anything a glance can settle."
    - "Violence pressure has been climbing onto the floor for days."
    - "A brawl from last week is still riding their breath tonight."
    - "Third visit running, the same group brings the same tension back."

negativeExamples:
  - "Shouting voices. violence pressure. main room may break." (legacy composeBody glue)
  - "Damaged main room: main room" (legacy `pickAreaStateAdjective` + duplicate subject)
  - "Their rowdiness is 80 and the damage is 60." (mechanical readout)
  - "Last week was rough." (unbacked history claim)

hardBounds:
  perSlotWords:
    title: 6
    establishing_line: 14
    reaction_line: 12
    manner_note: 10
  punctuation: normal prose punctuation only
  noFragmentsThatRequireConcatenation: true
  noMadLibPlaceholders: true
  noModernSlang: true
  noEarthIdioms: true
  noDirectMechanicalLanguage: true

gradientPolicy:
  base: one unconditional fallback per required slot (always fires)
  middle: single-condition snippets — a band, a pressure, a memory tag, a tone tag, a severity band, a voice axis, a verbal tic
  top: two-condition snippets — band + pressure, severity + repeat, axis + axis, band + memory
  rule: |
    customer_group.rowdiness is the band the violence picker fires on,
    so its low/high rungs are the dramatic anchors for the establishing
    line. Voice axes drive the reaction line; verbal tics surface the
    group's signature beat.

mustPass:
  coverage: required slots title, establishing_line, reaction_line each have an unconditional fallback
  specificityGradient: pools contain fallback + single-condition middle rung + two-condition top rung
  voiceBounds: every snippet within slot.maxWords; no trailing "…" or immediate duplicate token in title-role slots
  simCoherence: establishing_line is claims sim-backed; every non-fallback carries ≥1 state-lookup condition
  determinism: same seed + same state + same slot returns same snippet after FNV tie-break
  diversity: actor + state-perturbation sampler reaches title ≥3 distinct, establishing_line ≥1 distinct, reaction_line ≥3 distinct, manner_note ≥2 distinct
  dedupe: no near-duplicate pair (≥0.85 similarity) within slot; no canonical-equal text across slots

# ─── Phase 154 / ISSUE-122 — Legible Surface arc, Phase 9 ──────────
# Crises & Safety cluster matrix authoring. The violence card opens
# on a cross-role 3-meter cube (customer_group.rowdiness on
# primaryActor × customer_group.satisfaction on primaryActor ×
# area.damage on location) authored at spec-3 corners fixing
# rowdiness=high. Actor-voiced via cohort castAttributes
# (reaction/manner pools); establishing_line stays sim-backed
# narrator framing.
phase154:
  salienceTable:
    family: violence
    reads:
      - { kind: signal, role: primaryActor, signal: customer_group.rowdiness }
      - { kind: signal, role: primaryActor, signal: customer_group.satisfaction }
      - { kind: signal, role: location, signal: area.damage }
      - { kind: signal, role: primaryActor, signal: customer_group.loyalty }
      - { kind: pressure, pressureId: violence }
      - { kind: memory, tag: warning }
      - { kind: memory, tag: brawl }
      - { kind: memory, tag: security }
      - { kind: memory, tag: ban }
      - { kind: repeat, subjectTag: violence, atLeast: 3 }
    note: >
      customer_group.rowdiness leads as the strictly dominant picker
      driver (the picker scores `patronage + rowdiness`). satisfaction
      follows as the social dimension a player reads alongside
      rowdiness. area.damage on location follows because the violence
      damage cascade affects it. loyalty is the fourth meter — a
      low-loyalty rowdy group is a different problem than a high-
      loyalty one. Memory tags ordered to mirror response profile
      emissions (warning / brawl / security / ban). `severity`
      deliberately not added.
  saliencePolicy:
    slot: establishing_line
    policy: multi
    join: " — "
    note: >
      Multi-fact join is the fallback for unanticipated band pairs the
      spec-2 / spec-3 cells don't catch. The 4 spec-3 cube corners
      cover the readable rowdiness=high × satisfaction × area.damage
      2×2 face; the 4 spec-2 supports cover the off-extreme cells.
  newSnippets:
    establishing_line:
      cubeCorners:
        - est_high_row_high_sat_high_dmg
        - est_high_row_high_sat_low_dmg
        - est_high_row_low_sat_high_dmg
        - est_high_row_low_sat_low_dmg
      rowdinessSatisfactionDamageSupports:
        - est_high_row_high_sat
        - est_high_row_low_sat
        - est_high_row_high_dmg
        - est_low_sat_high_dmg
      topRungs:
        - est_low_sat_brawl_memory
        - est_high_dmg_security_memory
        - est_low_loyalty_ban_memory
    reaction_line:
      stateKeyed:
        - rxn_state_high_rowdiness
        - rxn_state_low_satisfaction
        - rxn_state_high_damage
        - rxn_state_rowdy_unhappy
        - rxn_state_pressure_brawl
        - rxn_state_security_repeat
    manner_note:
      stateKeyed:
        - mnr_state_high_rowdiness
        - mnr_state_low_satisfaction
        - mnr_state_high_damage
        - mnr_state_rowdy_damage
        - mnr_state_pressure_warning
  notes:
    - mid×mid cells (and mid-third-meter slots on the cube face) stay
      unauthored — the unconditional fallback handles them cleanly.
    - reaction_line snippets use first-person plural "we" framing —
      the cohort speaking, not an individual; a slip to "I" would
      break the template's cohort centring.
